name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  lint-and-test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: document_processing_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/document_processing_test_db
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/document_processing_test_db
      UPLOAD_DIR: /tmp/uploads
      EXTRACTED_TEXT_DIR: /tmp/extracted_texts
      ALLOWED_EXTENSIONS: '[".pdf", ".docx", ".txt"]'
      ALLOWED_CONTENT_TYPES: '["application/pdf", "application/vnd.openxmlformats-officedocument.wordprocessingml.document", "text/plain"]'
      JWT_SECRET_KEY: ci-test-jwt-secret-key-1234567890
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Check code formatting (Ruff)
        run: uv run ruff format --check .

      - name: Lint codebase (Ruff)
        run: uv run ruff check .

      - name: Run test suite (Pytest)
        run: uv run pytest -v
