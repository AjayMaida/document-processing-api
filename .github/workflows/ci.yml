name: CI

on:
  push:
    branches:
      - develop
      - main
      - "feature/complete-project"
      - "feature/cp-*"
  pull_request:
    branches:
      - develop
      - main
      - "feature/complete-project"

jobs:
  # ── Job 1: Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting dependencies
        run: pip install -r requirements/dev.txt

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  # ── Job 2: Test ──────────────────────────────────────────────────────────────
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: document_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/document_test_db
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/document_test_db
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      UPLOAD_DIR: uploads
      ALLOWED_EXTENSIONS: '[".pdf",".docx",".txt"]'
      ALLOWED_CONTENT_TYPES: '["application/pdf","application/vnd.openxmlformats-officedocument.wordprocessingml.document","text/plain"]'
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements/test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install test dependencies
        run: pip install -r requirements/test.txt

      - name: Create uploads directory
        run: mkdir -p uploads

      - name: Run tests
        run: pytest tests/ -v --tb=short

  # ── Job 3: Docker Build ───────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: document-processing-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
