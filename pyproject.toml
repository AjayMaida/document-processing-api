[project]
name = "document-processing-api"
version = "0.1.0"
description = "Production-ready Document Processing API"
requires-python = ">=3.12"
dependencies = [
    "alembic",
    "bcrypt<5",
    "email-validator",
    "fastapi",
    "passlib[bcrypt]",
    "psycopg[binary]",
    "pydantic-settings",
    "PyJWT",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-dotenv",
    "python-multipart",
    "sqlalchemy",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "ruff",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
