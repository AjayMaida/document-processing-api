services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: document_processing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d document_processing"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/document_processing
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/document_processing_test_db
      UPLOAD_DIR: /app/uploads
      EXTRACTED_TEXT_DIR: /app/extracted_texts
      ALLOWED_EXTENSIONS: '[".pdf", ".docx", ".txt"]'
      ALLOWED_CONTENT_TYPES: '["application/pdf", "application/vnd.openxmlformats-officedocument.wordprocessingml.document", "text/plain"]'
      JWT_SECRET_KEY: local-development-secret-change-before-deployment
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./extracted_texts:/app/extracted_texts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: uv run --no-sync celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/document_processing
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/document_processing_test_db
      UPLOAD_DIR: /app/uploads
      EXTRACTED_TEXT_DIR: /app/extracted_texts
      ALLOWED_EXTENSIONS: '[".pdf", ".docx", ".txt"]'
      ALLOWED_CONTENT_TYPES: '["application/pdf", "application/vnd.openxmlformats-officedocument.wordprocessingml.document", "text/plain"]'
      JWT_SECRET_KEY: local-development-secret-change-before-deployment
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - ./uploads:/app/uploads
      - ./extracted_texts:/app/extracted_texts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
